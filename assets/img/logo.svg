<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <!-- Straw Hat Gradient -->
    <linearGradient id="hatYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ribbonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Straw Hat Icon Mark -->
  <g transform="translate(6, 4)">
    <!-- Hat Crown -->
    <path d="M12 24 C12 13, 20 7, 28 7 C36 7, 44 13, 44 24 Z" fill="url(#hatYellow)" stroke="#B45309" stroke-width="1.2" />
    <!-- Red Ribbon -->
    <path d="M12.5 21 C17 19.5, 39 19.5, 43.5 21 L44 24 C38 23, 18 23, 12 24 Z" fill="url(#ribbonRed)" />
    <!-- Hat Brim -->
    <ellipse cx="28" cy="27" rx="24" ry="5.5" fill="url(#hatYellow)" stroke="#B45309" stroke-width="1.2" />
    <!-- Crossbone hints -->
    <circle cx="28" cy="15" r="3" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Brand Typography -->
  <text x="64" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#111827" letter-spacing="1.5">ONE PIECE</text>
  <text x="64" y="37" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#6B7280" letter-spacing="1.8">CANON WIKI PORTAL</text>
</svg>
